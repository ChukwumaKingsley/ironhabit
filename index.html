<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="IronHabit — Daily Home Exercise & Weekly Gym Accountability Tracker" />
  <title>IRONHABIT — Fitness &amp; Gym Accountability</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css?v=18" />
</head>
<body>
  <div class="app-shell">
    <div class="workspace-col">
      <!-- Top Header + Dual Metric Strip -->
      <header class="top-chrome">
        <div class="top-bar-row">
          <div class="brand-row">
            <span class="brand-name">IRONHABIT</span>
            <span id="hdr-date-meta" class="brand-meta tabular-nums">LOADING</span>
          </div>

          <div style="display:flex;align-items:center;gap:6px;">
            <button id="hdr-sync-btn" class="sync-badge-btn smooth-ui" onclick="App.HeaderSyncClick()" title="Cloud Sync Status">
              <span id="hdr-sync-dot" class="dot-indicator"></span>
              <span id="hdr-sync-label">Local</span>
            </button>
            <button id="hdr-lock-btn" class="icon-hdr-btn smooth-ui" onclick="App.HeaderLockClick()" title="Lock App">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <rect x="4" y="11" width="16" height="10" rx="1"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
              </svg>
            </button>
            <button id="hdr-profile-btn" class="profile-hdr-btn smooth-ui" onclick="App.ToggleSettings()" title="Profile &amp; Settings">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <path d="M20 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M4 21v-2a4 4 0 0 1 3-3.87"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span id="hdr-profile-label">Profile</span>
            </button>
          </div>
        </div>

        <div class="dual-metrics-grid">
          <!-- Home Streak Metric Box -->
          <div class="metric-box">
            <div>
              <div class="metric-label">Home Streak</div>
              <div class="metric-value tabular-nums">
                <span id="hdr-home-streak">0</span>
                <span class="metric-unit">days</span>
              </div>
            </div>
            <div class="metric-right">
              <div id="hdr-home-status" class="text-xs font-semibold tabular-nums text-amber" style="font-size:0.75rem;font-weight:600;">0%</div>
              <div id="hdr-home-best" class="metric-sub tabular-nums">Best: 0d</div>
            </div>
          </div>

          <!-- Weekly Gym Metric Box -->
          <div class="metric-box">
            <div>
              <div class="metric-label">Gym Weekly</div>
              <div class="metric-value tabular-nums">
                <span id="hdr-gym-ratio">0/4</span>
                <span class="metric-unit">days</span>
              </div>
            </div>
            <div class="metric-right">
              <div id="hdr-gym-status" class="text-xs font-semibold tabular-nums text-amber" style="font-size:0.75rem;font-weight:600;">In Prog</div>
              <div id="hdr-gym-streak" class="metric-sub tabular-nums">0w Streak</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic Screen Body -->
      <main id="main-view" class="main-body"></main>
    </div>

    <!-- Navigation Zone: Bottom Bar on Mobile, Left Sidebar on Desktop/Web -->
    <aside class="bottom-fixed-zone">
      <div class="bottom-fixed-inner">
        <div class="sidebar-nav-header">
          <div class="sidebar-nav-title">Workspace</div>
        </div>

        <div class="legend-footer">
          <div class="legend-group">
            <span class="legend-item"><span class="status-square bg-emerald" style="width:8px;height:8px;"></span>Met</span>
            <span class="legend-item"><span class="status-square bg-amber" style="width:8px;height:8px;"></span>Incomplete</span>
            <span class="legend-item"><span class="status-square bg-red" style="width:8px;height:8px;"></span>0 / Missed</span>
          </div>
          <div class="legend-group">
            <span class="legend-item"><span style="width:8px;height:8px;border-radius:50%;background:var(--sky-400);display:inline-block;"></span>Gym Visit</span>
            <span class="legend-item"><span style="width:10px;border-top:1px dashed var(--sky-400);display:inline-block;"></span>Target</span>
          </div>
        </div>

        <nav class="bottom-nav-grid">
          <button id="dock-today" class="nav-tab-btn active smooth-ui" onclick="App.SetScreen('today')">
            <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <rect x="3" y="4" width="18" height="16" rx="1"></rect>
              <path d="M8 12l2.5 2.5L16 9"></path>
            </svg>
            <span>Today</span>
          </button>
          <button id="dock-calendar" class="nav-tab-btn smooth-ui" onclick="App.SetScreen('calendar')">
            <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <rect x="3" y="4" width="18" height="17" rx="1"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Calendar</span>
          </button>
          <button id="dock-charts" class="nav-tab-btn smooth-ui" onclick="App.SetScreen('charts')">
            <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <polyline points="3 17 9 11 13 15 21 7"></polyline>
              <polyline points="16 7 21 7 21 12"></polyline>
            </svg>
            <span>Charts</span>
          </button>
          <button id="dock-goals" class="nav-tab-btn smooth-ui" onclick="App.SetScreen('goals')">
            <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <circle cx="12" cy="12" r="9"></circle>
              <circle cx="12" cy="12" r="5"></circle>
              <circle cx="12" cy="12" r="1"></circle>
            </svg>
            <span>Goals</span>
          </button>
        </nav>
      </div>
    </aside>
  </div>

  <!-- Slide-Over Profile & Settings Overlay Panel -->
  <div id="settings-overlay" class="settings-overlay" style="display:none;" onclick="if(event.target===this) App.CloseSettings()"></div>

  <!-- Full-Screen Passkey / PIN Authentication Gate -->
  <div id="auth-gate-overlay" class="auth-gate-overlay" style="display:none;"></div>

  <div id="toast-banner" class="toast-banner">Saved</div>

  <script src="./app.js?v=18"></script>
</body>
</html>
